apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-develop
  namespace: python-app-develop
  labels:
    app: python-app-develop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app-develop
  template:
    metadata:
      labels:
        app: python-app-develop
    spec:
      containers:
        - name: python-container
          image: guptatrng/python-app-develop:c3f461f6164e29150d6ae2c951a5b4d3829e8bed
          ports:
            - containerPort: 5000
      resource:
