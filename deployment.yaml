apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-develop
  namespace: python-app-develop
  labels:
    app: python-app-develop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app-develop
  template:
    metadata:
      labels:
        app: python-app-develop
    spec:
      containers:
        - name: python-container
          image: guptatrng/python-app-develop:84e9aea82415a6ae9cc12f0e27f4e477129e5105
          ports:
            - containerPort: 5000
      resource:
